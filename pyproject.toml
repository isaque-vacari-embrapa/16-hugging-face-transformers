[project]
name = "16-hugging-face-transformers"
version = "0.1.0"
description = "Sistema generativo de perguntas e respostas sobre a coleção digital da Embrapa, com Hugging Face Transformers, Docling e Streamlit"
authors = [
    {name = "Isaque Vacari",email = "isaque.vacari@embrapa.br"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "docling (>=2.0)",
    "transformers (>=4.44)",
    "torch (>=2.5)",
    "datasets (>=3.0)",
    "accelerate (>=1.0)",
    "sentencepiece (>=0.2)",
    "protobuf (>=4.0)",
    "evaluate (>=0.4)",
    "sacrebleu (>=2.4)",
    "rouge-score (>=0.1.2)",
    "streamlit (>=1.38)",
    "click (>=8.1)",
    "mlflow (>=3.15.1,<4.0.0)",
    "pandas (>=2.2,<3)",
    "peft (>=0.14)",
    "bitsandbytes (>=0.45)",
]

[project.scripts]
qa-embrapa = "app.cli:cli"

[tool.poetry]
packages = [{include = "app", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "pytest (>=8.3,<9.0)"
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
